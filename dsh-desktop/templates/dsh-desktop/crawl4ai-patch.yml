# crawl4ai MCP insert for the official @deepseek-ai/dsh-mcp-client.
# Rendered by dsh-desktop/prep.* with the ABSOLUTE path of the crawl4ai
# executable inside the workspace venv (no PATH / uvx dependency at runtime,
# since the DSH Desktop app process does not carry ~/.local/bin on PATH).
# The env block keeps crawl4ai's own data and the Playwright browser inside the
# workspace too (~/.crawl4ai and the platform browser cache are never touched).
# One instance = one server. Server commands run OUTSIDE the agent sandbox, so
# only pinned, trusted executables are enabled.
- insert:
    - id: mcp-crawl4ai
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: crawl4ai
        transport: stdio
        command: {{CRAWL4AI_BIN}}
        cwd: {{WORKSPACE}}
        env:
          CRAWL4_AI_BASE_DIRECTORY: {{WORKSPACE}}
          PLAYWRIGHT_BROWSERS_PATH: {{WORKSPACE}}/.browsers
          PYTHONUTF8: '1'